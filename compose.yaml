services:
  uptime-kuma:
    # Build the local branch from source instead of pulling the public image.
    # Dockerfile.local builds the frontend (dist) inside the image, so no host
    # Node.js/npm is needed — only Docker. Everything is taken from your working
    # tree / current branch.
    build:
      context: .
      dockerfile: Dockerfile.local
    image: uptime-kuma:local
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      # <Host Port>:<Container Port>
      - "3001:3001"
